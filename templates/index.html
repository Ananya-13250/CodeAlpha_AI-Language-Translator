<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        AI Language Translator
    </title>


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"

<body>

    <!-- HEADER -->

        <h1>
            🌐 AI Language Translator

                </select>

            </div>

        </div>


        <!-- TEXT AREAS -->

        <div class="text-area-container">


            <!-- INPUT -->

            <div class="text-box">

                <label for="inputText">
                    Enter text
                </label>


                <textarea
                    id="inputText"
                    placeholder="Type something to translate..."
                ></textarea>

            </div>


            <!-- OUTPUT -->

            <div class="text-box">

                <label for="translatedText">
                    Translation
                </label>


                <textarea
                    id="translatedText"
                    placeholder="Translation will appear here..."
                    readonly
                ></textarea>


                <!-- PRONUNCIATION -->

                <div
                    id="pronunciationContainer"
                >

                    <strong
                        id="pronunciationTitle"
                    >
                        Pronunciation:
                    </strong>


                    <p
                        id="pronunciation"
                    ></p>

                </div>

            </div>

        </div>


        <!-- TRANSLATE BUTTON -->

        <button
            id="translateButton"
            class="translate-button"
        >
            Translate
        </button>


        <!-- ACTION BUTTONS -->

        <div class="action-buttons">


            <button
                id="copyButton"
            >
                📋 Copy
            </button>


            <button
                id="speakButton"
            >
                🔊 Speak
            </button>


            <button
